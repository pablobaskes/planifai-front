<main class="page-shell">
  <header class="page-header">
    <h1>Tareas</h1>
    <button type="button" (click)="loadTasks()" [disabled]="loading()">Actualizar</button>
  </header>

  <section class="form-panel">
    <h2>Nueva tarea</h2>
    <form [formGroup]="taskForm" (ngSubmit)="saveTask()" class="task-form">
      <label>
        Titulo
        <input type="text" formControlName="title">
      </label>
      <label>
        Prioridad
        <select formControlName="priority">
          <option *ngFor="let priority of priorities" [value]="priority">{{ priority }}</option>
        </select>
      </label>
      <label>
        Estado
        <select formControlName="status">
          <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
        </select>
      </label>
      <label>
        Fecha limite
        <input type="date" formControlName="dueDate">
      </label>
      <label class="wide">
        Descripcion
        <textarea rows="3" formControlName="description"></textarea>
      </label>
      <div class="form-actions">
        <button type="submit" [disabled]="saving()">{{ saving() ? 'Guardando...' : 'Guardar' }}</button>
      </div>
    </form>
  </section>

  <p *ngIf="error()" class="error">{{ error() }}</p>
  <p *ngIf="loading()">Cargando tareas...</p>

  <table *ngIf="!loading() && tasks().length > 0">
    <thead>
      <tr>
        <th>Titulo</th>
        <th>Estado</th>
        <th>Prioridad</th>
        <th>Fecha limite</th>
        <th>Descripcion</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let task of tasks(); trackBy: trackById">
        <td>{{ task.title }}</td>
        <td>{{ task.status }}</td>
        <td>{{ task.priority }}</td>
        <td>{{ task.dueDate || '-' }}</td>
        <td>{{ task.description || '-' }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading() && tasks().length === 0">No hay tareas todavia.</p>
</main>
